# NOTA: Este archivo es de referencia. El install.sh genera uno actualizado
# en /opt/streaming/docker-compose.yml con las rutas correctas del sistema.

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: 1000:1000
    group_add:
      - '122'  # Render group ID (ajustar según sistema)
    devices:
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
      - /dev/mali0:/dev/mali0
      - /dev/rga:/dev/rga
      - /dev/mpp_service:/dev/mpp_service
    volumes:
      - /opt/streaming/configs/jellyfin:/config
      - /opt/streaming/data/jellyfin/cache:/cache
      - /opt/streaming/final:/media
      - /opt/streaming/procesando:/videos
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=America/Mexico_City
