# NOTA: Este archivo es de referencia. El install.sh genera uno actualizado
# en /opt/streaming/docker-compose.yml con las rutas correctas del sistema.
#
# Kernel vendor (linux-image-vendor-rk35xx):
#   Expone codecs via mpp_service en lugar de V4L2.

services:
  jellyfin:
    # Jellyfin 10.11.x estable, rama arm64 de nyanmisaka (parser Rockchip/RKMPP).
    # Pinned por digest: el tag flota en el repo, el digest no.
    image: nyanmisaka/jellyfin:260326-arm64@sha256:91c01c7e74a8e803593ead9972bf72842325bef36d6f07dcdbc33da331d652b8
    container_name: jellyfin
    user: 1000:1000
    group_add:
      - '993'  # Render group ID (ajustar según sistema: getent group render)
      - '44'   # Video group
    devices:
      - /dev/dri:/dev/dri
      - /dev/mpp_service:/dev/mpp_service
      # Acelerador 2D (scale_rkrga). install.sh los agrega condicionalmente si existen.
      - /dev/rga:/dev/rga
      - /dev/dma_heap:/dev/dma_heap
    # Necesario para que el decoder HW de HEVC (rkvdec) inicialice el contexto MPP.
    # Sin esto: "hevc_rkmpp: Failed to init MPP context: -1" -> decode por software.
    security_opt:
      - systempaths=unconfined
      - apparmor=unconfined
    volumes:
      - /opt/streaming/configs/jellyfin:/config
      - /opt/streaming/data/jellyfin/cache:/cache
      - /opt/streaming/final:/media
      - /opt/streaming/procesando:/videos
    network_mode: host
    restart: unless-stopped
    environment:
      - TZ=America/Mexico_City
